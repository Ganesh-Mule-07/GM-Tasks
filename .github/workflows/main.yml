name: Build GM Tasks APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Check Android Project
        run: |
          echo "Repository files:"
          ls -la
          echo ""
          echo "Project folder:"
          ls -la GM_Tasks_Android_CloudBuild
          echo ""
          echo "Android project settings:"
          cat GM_Tasks_Android_CloudBuild/settings.gradle

      - name: Build APK
        working-directory: GM_Tasks_Android_CloudBuild
        run: |
          gradle assembleDebug

      - name: Check APK
        run: |
          echo "APK files:"
          find GM_Tasks_Android_CloudBuild/app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GM-Tasks-APK
          path: GM_Tasks_Android_CloudBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
